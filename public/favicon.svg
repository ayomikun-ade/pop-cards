<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="popGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006837" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBB03B" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="120" fill="url(#popGrad)" />

  <!-- NYSC Gold Laurel / Sun Accent Circle -->
  <circle cx="370" cy="140" r="44" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Passing-Out Graduation Cap Icon Detail -->
  <path d="M370 120 L400 135 L370 150 L340 135 Z" fill="#FFFFFF" />
  <path d="M388 142 L388 158" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Bold Letter 'P' -->
  <text x="135" y="380" font-family="'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="340" fill="#FFFFFF">P</text>

  <!-- Authentic Nigerian Green/Gold Border Indicator -->
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="#FBB03B" stroke-width="8" opacity="0.4" />
</svg>
